; ============================================================================
; PlatformIO Project Configuration for Physical Autonomous ESP32 Micromouse
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -std=c++17
    -O3
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    pololu/VL53L1X @ ^1.3.1
